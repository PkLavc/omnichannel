name: ${COMPOSE_PROJECT_NAME:-omnichannel-platform}

x-postgres-image: &postgres-image pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
x-chatwoot-image: &chatwoot-image chatwoot/chatwoot:v4.16.0@sha256:64eafea4d4e8e73dcc534f7012cc93c0b04635f235861eda2d588d1f33166827
x-ollama-image: &ollama-image ollama/ollama:0.32.1@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
x-gateway-image: &gateway-image ai-gateway:local

x-postgres-env: &postgres-env
  POSTGRES_USER: platform
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev}
  POSTGRES_DB: gateway
  APP_DATABASE_USER: platform
  APP_DATABASE_NAME: gateway

x-gateway-env: &gateway-env
  PORT: "3001"
  DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD:-platform_dev}@postgres:5432/gateway
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:-development-only-key-change-me}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-change-this-admin-token}
  NEXUS_SSO_REDEEM_URL: ${NEXUS_SSO_REDEEM_URL:-}
  NEXUS_SSO_REDEEM_TIMEOUT_MS: ${NEXUS_SSO_REDEEM_TIMEOUT_MS:-5000}
  NEXUS_SSO_ISSUER: ${NEXUS_SSO_ISSUER:-https://sso.example.com}
  NEXUS_SSO_AUDIENCE: ${NEXUS_SSO_AUDIENCE:-omnichannel-admin}
  ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
  COMMERCIAL_EVENTS_TOKEN: ${COMMERCIAL_EVENTS_TOKEN:-}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: all-minilm
  EMBEDDING_TIMEOUT_MS: "30000"
  # Global seed files are intentionally absent. Import tenant-owned files through the Admin.
  QUICK_REPLIES_PATH: /private-data/_disabled/no-global-quick-replies.xlsx
  BOT_JSON_PATH: /private-data/_disabled/no-global-business-rules.json

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-development-secret-change-me}
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: chatwoot
  POSTGRES_USERNAME: platform
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev}
  REDIS_URL: redis://redis:6379
  ACTIVE_STORAGE_SERVICE: local
  ENABLE_ACCOUNT_SIGNUP: "false"
  CHATWOOT_ADMIN_EMAIL: ${CHATWOOT_ADMIN_EMAIL:-admin@example.local}
  CHATWOOT_ADMIN_PASSWORD: ${CHATWOOT_ADMIN_PASSWORD:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
  RAILS_LOG_TO_STDOUT: "true"
  # Required for the Chatwoot webhook to reach the Gateway on the private Compose network.
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"

services:
  postgres:
    image: *postgres-image
    restart: "no"
    stop_grace_period: 60s
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-init:
    image: *postgres-image
    restart: "no"
    entrypoint: ["/bin/sh", "/docker/init-databases.sh"]
    environment: *postgres-env
    volumes:
      - ./docker/postgres/init-databases.sh:/docker/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: "no"
    stop_grace_period: 30s
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  gateway-migrate:
    image: *gateway-image
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *gateway-env
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  gateway:
    image: *gateway-image
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: "no"
    stop_grace_period: 60s
    environment: *gateway-env
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${OMNICHANNEL_DATA_ROOT:-../omnichannel-data}
        target: /private-data
        read_only: true
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  admin:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: "no"
    volumes:
      - ./apps/admin:/usr/share/nginx/html:ro
      - ./docker/admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3002:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      gateway:
        condition: service_healthy

  ollama:
    image: *ollama-image
    profiles: ["local-ai"]
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  n8n:
    image: n8nio/n8n@sha256:15091606d98f6d15bad10cb26bb937ccb47dfd9fee2bb7ae44c7061cba2e7a04
    restart: "no"
    stop_grace_period: 60s
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: platform
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-development-n8n-key-change-me}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  chatwoot-migrate:
    image: *chatwoot-image
    restart: "no"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  chatwoot:
    image: *chatwoot-image
    restart: "no"
    stop_grace_period: 60s
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 3000).close"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  chatwoot-worker:
    image: *chatwoot-image
    restart: "no"
    stop_grace_period: 60s
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
  chatwoot_storage:
